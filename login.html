<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>Sign in | Kukurantumi Church Of Christ Youth</title>
  <script>
    (() => {
      const key = "kukurantumi-theme";
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const readMode = () => {
        try {
          const mode = localStorage.getItem(key);
          return ["system", "light", "dark"].includes(mode) ? mode : "system";
        } catch { return "system"; }
      };
      const applyMode = mode => {
        const theme = mode === "system" ? (media.matches ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = theme;
        document.querySelectorAll("[data-theme-logo]").forEach(logo => {
          logo.src = theme === "dark" ? logo.dataset.darkSrc : logo.dataset.lightSrc;
        });
      };
      applyMode(readMode());
      window.addEventListener("DOMContentLoaded", () => {
        applyMode(readMode());
        media.addEventListener("change", () => { if (readMode() === "system") applyMode("system"); });
      });
    })();
  </script>
  <style>
    :root { color-scheme: light; --ink:#202921; --muted:#737b72; --line:#e5e8e1; --paper:#fff; --field:#fff; --canvas:#f6f7f2; --forest:#244c3b; --forest-dark:#193a2c; --gold:#d7a94b; --mark-bg:#edf2e9; --mark-border:#d4dfd1; --page-background:radial-gradient(ellipse at 15% 10%,#e5ecdf 0,transparent 38%),linear-gradient(135deg,#f6f7f2,#e9eee6); --card-shadow:0 18px 45px #20292112; --error:#8a4038; }
    :root[data-theme="dark"] { color-scheme:dark; --ink:#edf2ec; --muted:#aab7ac; --line:#3b4b40; --paper:#202b24; --field:#19241d; --canvas:#141d17; --forest:#6fa17c; --forest-dark:#17241b; --gold:#e2bd70; --mark-bg:#2b3b30; --mark-border:#405848; --page-background:radial-gradient(ellipse at 15% 10%,#23352a 0,transparent 38%),linear-gradient(135deg,#141d17,#1c2820); --card-shadow:0 18px 45px rgba(0,0,0,.28); --error:#edaaa0; }
    * { box-sizing:border-box; }
    body { display:grid; min-height:100vh; margin:0; place-items:center; padding:24px; background:var(--page-background); color:var(--ink); font:14px/1.5 "Segoe UI",sans-serif; }
    .login { width:min(420px,100%); border:1px solid var(--line); border-radius:5px; padding:34px; background:var(--paper); box-shadow:var(--card-shadow); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:30px; }
    .brand-logo { display:block; width:104px; height:auto; flex:0 0 auto; border-radius:3px; }
    .brand strong { display:block; font:20px Georgia,serif; }
    .brand small { color:var(--muted); font-size:10px; letter-spacing:1px; text-transform:uppercase; }
    h1 { margin:0; font:30px/1.15 Georgia,serif; }
    .intro { margin:8px 0 24px; color:var(--muted); }
    form { display:grid; gap:15px; }
    label { display:grid; gap:6px; color:var(--muted); font-size:12px; font-weight:600; }
    input { min-height:42px; border:1px solid var(--line); border-radius:4px; padding:0 11px; background:var(--field); color:var(--ink); font:inherit; }
    input:focus-visible,button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
    button { min-height:42px; border:1px solid var(--forest); border-radius:4px; background:var(--forest); color:#fff; font:600 14px "Segoe UI",sans-serif; cursor:pointer; }
    button:hover { background:var(--forest-dark); }
    .error { min-height:20px; margin:0; color:var(--error); font-size:12px; }
    @media(max-width:480px) { .login { padding:25px 21px; } }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand"><img class="brand-logo" src="/assets/church-logo.svg" data-theme-logo data-light-src="/assets/church-logo.svg" data-dark-src="/assets/church-logo-dark.svg" alt="Church of Christ logo"><div><strong>Kukurantumi Church Of Christ Youth</strong><small>Youth Ministry</small></div></div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in with your youth ministry account.</p>
    <form id="login-form">
      <label>Username<input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" role="alert" aria-live="polite"></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const errorText = document.getElementById("login-error");
    fetch("/api/auth/me").then(response => { if (response.ok) location.replace("/dashboard"); }).catch(() => {});
    form.addEventListener("submit", async event => {
      event.preventDefault();
      errorText.textContent = "";
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
        const responseText = await response.text();
        let result;
        try {
          result = responseText ? JSON.parse(responseText) : {};
        } catch {
          throw new Error(`The server returned an unexpected response (HTTP ${response.status}). Check the backend URL and deployment.`);
        }
        if (!response.ok) throw new Error(result.error || "Unable to sign in.");
        location.replace("/dashboard");
      } catch (error) {
        errorText.textContent = error.message === "Failed to fetch" ? "Cannot reach the Kukurantumi Church Of Christ Youth server." : error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
